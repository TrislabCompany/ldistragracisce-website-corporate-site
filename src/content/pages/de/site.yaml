gameDamage:
  lead: "Wie Sie Schäden melden, die Wild an landwirtschaftlichen Flächen verursacht hat, und wie Sie Ihre Flächen schützen."
  reportHeading: "So melden Sie einen Schaden"
  reportIntro: "Wenn Sie auf Ihren Flächen einen Wildschaden bemerken, gehen Sie so vor:"
  steps:
    - "Benachrichtigen Sie die Jagdgesellschaft, sobald Sie den Schaden bemerken. Die Kontaktdaten finden Sie auf der Seite Kontakt."
    - "Notieren Sie Ort, Umfang und Art des Schadens und machen Sie Fotos oder sichern Sie andere Nachweise."
    - "Arbeiten Sie bei der Besichtigung und Dokumentation des Schadens mit der Jagdgesellschaft zusammen und füllen Sie die nötigen Formulare aus."
  protectHeading: "Landwirtschaftliche Flächen schützen"
  protectIntro: "Wirksamer Schutz vor Wild braucht mehrere Maßnahmen und regelmäßige Pflege. Wir empfehlen:"
  measures:
    - "Elektro- oder normale Zäune um die am stärksten gefährdeten Flächen"
    - "Vergrämungsmittel (optisch, akustisch oder geruchlich)"
    - "die Zusammenarbeit mit der Jagdgesellschaft bei Fütterungen, die das Wild von den Feldern fernhalten"
    - "rechtzeitige Ernte und das Entfernen von Ernteresten, die Wild anlocken"
    - "Schutznetze oder Folien an Obstbäumen und in Weinbergen"
  maintenance: "Prüfen Sie den Schutz regelmäßig, beheben Sie Schäden und erneuern Sie die Vergrämungsmittel, damit die Maßnahmen die ganze Saison wirken."

membership:
  lead: "Wir begrüßen neue Mitglieder, die bei der Bewirtschaftung des Reviers und beim Naturschutz mitwirken möchten."
  requirementsHeading: "Voraussetzungen für die Mitgliedschaft"
  requirementsIntro: "Wer Mitglied werden möchte, muss diese Voraussetzungen erfüllen:"
  requirements:
    - "Mindestalter 18 Jahre"
    - "Staatsbürgerschaft der Republik Slowenien"
    - "bestandene Jägerprüfung"
    - "keine Vorstrafen wegen jagdbezogener Straftaten"
    - "Bereitschaft, aktiv im Verein mitzuwirken"
    - "Achtung der Waidgerechtigkeit und der jagdlichen Tradition"
  examHeading: "Der Weg zur Jägerprüfung"
  examIntro: "Der Weg zur Jägerprüfung umfasst eine theoretische und eine praktische Ausbildung:"
  examSteps:
    - "Theoretische Ausbildung (40 Stunden)."
    - "Praktische Ausbildung im Revier mit einem Mentor."
    - "Kenntnis der Jagdwaffen und ihres sicheren Gebrauchs."
    - "Die Jägerprüfung vor der Prüfungskommission."
  applyHeading: "So werden Sie Mitglied"
  applyText: "Wenn Sie sich für eine Mitgliedschaft interessieren, schreiben Sie uns. Wir stellen Ihnen den Verein gern vor und beantworten Ihre Fragen."

