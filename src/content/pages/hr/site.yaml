gameDamage:
  lead: "Kako prijaviti štetu koju je divljač napravila na poljoprivrednim površinama i kako zaštititi površine."
  reportHeading: "Kako prijaviti štetu"
  reportIntro: "Ako ste na svojim površinama primijetili štetu koju je napravila divljač, slijedite ove korake:"
  steps:
    - "Čim primijetite štetu, obavijestite lovačko društvo. Kontakt je na stranici Kontakt."
    - "Pripremite podatke o lokaciji, opsegu i vrsti štete te fotografije ili druge dokaze."
    - "Surađujte s lovačkim društvom pri pregledu i dokumentiranju štete te ispunite potrebne obrasce."
  protectHeading: "Zaštita poljoprivrednih površina"
  protectIntro: "Učinkovita zaštita od divljači zahtijeva više mjera i redovito održavanje. Preporučujemo:"
  measures:
    - "električne ili obične ograde oko najugroženijih površina"
    - "sredstva za odvraćanje (vizualna, zvučna ili mirisna)"
    - "suradnju s lovačkim društvom na hranilištima koja odvraćaju divljač od polja"
    - "pravovremenu žetvu i uklanjanje ostataka uroda koji privlače divljač"
    - "zaštitne mreže ili folije na voćkama i u vinogradima"
  maintenance: "Redovito provjeravajte zaštitu, popravljajte oštećenja i obnavljajte sredstva za odvraćanje, kako bi mjere bile učinkovite cijelu sezonu."

membership:
  lead: "Pozivamo nove članove koji žele sudjelovati u gospodarenju lovištem i zaštiti prirode."
  requirementsHeading: "Uvjeti za članstvo"
  requirementsIntro: "Kandidat za člana mora ispunjavati ove uvjete:"
  requirements:
    - "najmanje 18 godina starosti"
    - "državljanstvo Republike Slovenije"
    - "položen lovački ispit"
    - "nekažnjavanost za kaznena djela iz područja lovstva"
    - "spremnost na aktivno sudjelovanje u društvu"
    - "poštovanje lovačke etike i tradicije"
  examHeading: "Put do lovačkog ispita"
  examIntro: "Put do lovačkog ispita uključuje teorijsku i praktičnu obuku:"
  examSteps:
    - "Teorijska obuka (40 sati)."
    - "Praktična obuka u lovištu uz mentora."
    - "Upoznavanje s lovačkim oružjem i sigurnim rukovanjem njime."
    - "Lovački ispit pred ispitnom komisijom."
  applyHeading: "Kako se učlaniti"
  applyText: "Ako vas zanima članstvo, pišite nam. Rado ćemo vam predstaviti društvo i odgovoriti na vaša pitanja."

