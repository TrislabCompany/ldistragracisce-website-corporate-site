about:
  lead: "Lovačko društvo Istra Gračišče dio je lokalne zajednice od 1947. Lovačku tradiciju spajamo sa suvremenim gospodarenjem divljači i zaštitom prirode."
  sections:
    - heading: "Tko smo"
      paragraphs:
        - "Lovačko društvo (lovska družina) dobrovoljno je, samostalno i neprofitno udruženje ljudi koji su se povezali radi zaštite, uzgoja i lova divljači, gospodarenja lovištem i drugih djelatnosti povezanih s lovstvom."
        - "Aktivna smo zajednica koja spaja iskustvo starijih i energiju mlađih članova. Osim lova organiziramo edukacije i društvena događanja te sudjelujemo u ekološkim projektima lokalne zajednice."
    - heading: "Povijest"
      paragraphs:
        - "Društvo je osnovano 1947. kao mala skupina predanih lovaca. Kroz desetljeća je raslo, čuvajući ravnotežu između lovačke tradicije i suvremenog gospodarenja divljači."
    - heading: "Misija"
      paragraphs:
        - "Naša je misija održivo gospodarenje lovištem i divljači te poučavanje članova i javnosti o važnosti zaštite prirode. Zalažemo se za odgovoran lov utemeljen na poštovanju prirode i životinja te na očuvanju bioraznolikosti."
    - heading: "Vrijednosti"
      paragraphs:
        - "Temelj našeg rada su lovačka etika, odgovornost prema prirodi i divljači, suradnja s lokalnom zajednicom i prenošenje znanja mlađim naraštajima."
  officersHeading: "Organizacija"
  officersText: "Društvo vode izabrani dužnosnici. Navodimo ih po funkcijama; za kontakt koristite e-adresu društva."
  officers:
    - "Predsjednik društva (starešina)"
    - "Lovnik (gospodar)"
    - "Tajnik"
  clubHeading: "Više o društvu"

huntingGround:
  lead: "Lovište se prostire na raznolikom terenu slovenske Istre, gdje se isprepliću krški pašnjaci, šume i poljoprivredne površine."
  sections:
    - heading: "Područje lovišta"
      paragraphs:
        - "Lovište leži na Krškom rubu i obuhvaća teren od nizinskih predjela do viših krških visoravni. Posebnost lovišta je ispreplitanje staništa: krških pašnjaka, šumovitih padina i tradicionalnih poljoprivrednih površina."
        - "Taj raznoliki prostor pruža dobre uvjete za mnoge vrste divljači i omogućuje održivo gospodarenje lovištem."
  speciesHeading: "Divljač u lovištu"
  speciesIntro: "U lovištu živi divljač tipična za krško područje. Posebnu pozornost posvećujemo srnećoj divljači i divljim svinjama, dvjema najvažnijim vrstama lovišta."
  species:
    - id: red-deer
      name: "Jelen obični"
      latin: "Cervus elaphus"
      text: "Naša najveća vrsta divljači, koja se zadržava u šumovitim dijelovima lovišta."
      alt: "Jelen s razgranatim rogovljem na livadi"
    - id: roe-deer
      name: "Srneća divljač"
      latin: "Capreolus capreolus"
      text: "Jedna od dviju najvažnijih vrsta lovišta, kod kuće na rubu šume i na livadama."
      alt: "Srnjak na livadi u jutarnjoj izmaglici"
    - id: wild-boar
      name: "Divlja svinja"
      latin: "Sus scrofa"
      text: "Druga najvažnija vrsta lovišta; njome gospodarimo u suradnji s lokalnim poljoprivrednicima."
      alt: "Divlja svinja s prugastom prasadi u šumi"
    - id: hare
      name: "Europski zec"
      latin: "Lepus europaeus"
      text: "Sitna divljač otvorenih livada i polja."
      alt: "Europski zec u travi na rubu šume"
    - id: fox
      name: "Lisica"
      latin: "Vulpes vulpes"
      text: "Prilagodljiva zvijer koja živi u svim dijelovima lovišta."
      alt: "Lisica viri iz visoke trave"
    - id: jackal
      name: "Čagalj"
      latin: "Canis aureus"
      text: "Posljednjih se godina širi Krasom i Istrom."
      alt: "Čagalj stoji na pokošenoj livadi i gleda prema fotografu"
    - id: partridge
      name: "Trčka skvržulja"
      latin: "Perdix perdix"
      text: "Pernata divljač krških pašnjaka i polja."
      alt: "Trčke na preoranoj njivi uz grmlje"
    - id: pheasant
      name: "Fazan"
      latin: "Phasianus colchicus"
      text: "Pernata divljač polja i živica."
      alt: "Fazan pijetao na livadi"
  management:
    heading: "Gospodarenje lovištem"
    paragraphs:
      - "Gospodarenje se temelji na načelima održivog lovstva i zaštite prirode. Redovito pratimo stanje populacija divljači, brinemo o hranilištima i solištima te održavamo lovačke čeke i druge objekte."
      - "Posebnu pozornost posvećujemo sprječavanju šteta na poljoprivrednim površinama i suradnji s lokalnim poljoprivrednicima."

huntingTourism:
  sections:
    - heading: "Lov u slovenskoj Istri"
      paragraphs:
        - "Gostima nudimo lov na jelena, srnu i divlju svinju u raznolikom lovištu između Krškog ruba i istarskih brežuljaka."
        - "Svaki gost lovi u pratnji iskusnog lovca društva koji poznaje lovište i divljač. Gost se pridržava uputa pratitelja i odstrjeljuje samo divljač koju mu pratitelj odredi."
    - heading: "Noćenje u lovačkom domu"
      paragraphs:
        - "Lovci gosti mogu noćiti u lovačkom domu društva. Spavaju ondje gdje lov počinje i ujutro i navečer, kad je divljač najaktivnija, brzo su u lovu."
        - "Noćenje u lovačkom domu jedna je od prednosti našeg lovnog turizma. Uvjete boravka daje referent za lovni turizam."
  offersHeading: "Naša ponuda"
  seasonsHeading: "Lovne sezone"
  seasonsIntro: "Lovne sezone određuje slovenska Uredba o određivanju divljači i lovnih sezona (Uredba o določitvi divjadi in lovnih dob). Ovise o vrsti, spolu i dobi divljači:"
  seasonColumns:
    species: "Vrsta"
    season: "Lovna sezona"
  seasons:
    - species: "Jelen"
      season: "16. 8. – 31. 12."
    - species: "Košuta"
      season: "1. 9. – 31. 12."
    - species: "Srnjak"
      season: "1. 5. – 31. 10."
    - species: "Divlja svinja: vepar, prasad i nazimad"
      season: "cijele godine"
    - species: "Divlja svinja: krmača"
      season: "1. 7. – 31. 1."
  needsHeading: "Što treba lovac gost"
  needs:
    - "dozvolu za lovce goste, ako nema važeću slovensku lovačku iskaznicu (vidi dolje)"
    - "europsku propusnicu za vatreno oružje, ako donosi vlastito oružje iz druge države Europske unije"
    - "termin lova dogovoren s referentom za lovni turizam"
    - "pratnju lovca našeg društva, kojeg društvo određuje za svaki lov"
  permit:
    heading: "Dozvola za lovce goste"
    paragraphs:
      - "Lovac gost koji nema važeću slovensku lovačku iskaznicu pravo na lov stječe dozvolom za lovce goste (dovolilnica za lovske goste). Oblik, sadržaj i cijenu dozvole određuje slovenski Pravilnik o dovolilnici za lovske goste (Uradni list RS, br. 86/2025), koji se primjenjuje od 1. siječnja 2026."
      - "Tjedna dozvola vrijedi 7 dana i stoji 20 eura, mjesečna vrijedi 30 dana i stoji 50 eura, a godišnja vrijedi do kraja kalendarske godine i stoji 150 eura. Gostu kojeg na lov pozove upravitelj lovišta može se izdati besplatna dozvola koja vrijedi 5 dana."
      - "Dozvola navodi lovište te ime, adresu, datum rođenja i državu prebivališta gosta. Kako je urediti za lov u našem lovištu, reći će vam referent za lovni turizam."
  enquireHeading: "Upit"
  enquireText: "Pišite nam ili nazovite referenta za lovni turizam i recite koja vas divljač i koji termin zanimaju. Odgovorit ćemo vam s uvjetima i ponudom."
  sources:
    - label: "Lovne sezone prema Uredbi o določitvi divjadi in lovnih dob, sažete na gov.si (Upravljanje z divjadjo, na slovenskom)"
      url: "https://www.gov.si/teme/upravljanje-z-divjadjo/"
    - label: "Pravilnik o dovolilnici za lovske goste, Uradni list RS 86/2025 (na slovenskom)"
      url: "https://pisrs.si/pregledPredpisa?sop=2025-01-3056"

huntingLodge:
  lead: "Lovački dom okuplja članove društva i nudi noćenje našim lovcima gostima."
  sections:
    - heading: "Lovački dom"
      paragraphs:
        - "U lovačkom domu članovi se sastaju na sastancima, prije zajedničkih lovova i na druženjima."
        - "Dom nudi i noćenje lovcima gostima. Gosti borave ondje gdje lov počinje, u društvu lovaca koji ih prate u lovu."
  featuresHeading: "Što nudi"
  features:
    - "noćenje za lovce goste"
    - "prostor za sastanke i susrete članova"
    - "polazište za zajedničke lovove"
    - "druženje lovaca gostiju s lovcima društva"
  tourismHeading: "Noćenje za lovce goste"
  tourismText: "Noćenje u lovačkom domu jedna je od prednosti našeg lovnog turizma: gost spava na polazištu za lov i ujutro je brzo na čeki. Uvjete boravka i ponudu lova daje referent za lovni turizam."

gameDamage:
  lead: "Tko odgovara za štetu od divljači, kako je prijaviti, kako se izračunava naknada i kako zaštititi svoje površine."
  kindsHeading: "Lovna divljač ili zaštićena vrsta?"
  kindsIntro: "Lovačko društvo procjenjuje samo štetu koju u lovištu počini lovna divljač. Štetu od zaštićenih vrsta prijavite Slovenskoj šumarskoj službi (Zavod za gozdove Slovenije)."
  kinds:
    - heading: "Lovna divljač: prijava lovačkom društvu"
      text: "Za štetu od lovne divljači u lovištu prema slovenskom Zakonu o divljači i lovstvu odgovara upravitelj lovišta, kod nas Lovska družina Istra Gračišče."
      species: "Lovna divljač su, primjerice, divlja svinja, jelen, srna, jazavac, europski zec, lisica, kune, fazan, šojka, svraka i siva vrana."
    - heading: "Zaštićene vrste: prijava šumarskoj službi"
      text: "Za štetu od zaštićenih divljih sisavaca i ptica prema slovenskom Zakonu o zaštiti prirode odgovara Republika Slovenija. Prijavite je mjesno nadležnoj područnoj jedinici Zavoda za gozdove Slovenije, a ne lovačkom društvu."
      species: "Zaštićene vrste su, primjerice, vuk, smeđi medvjed, ris, vidra i dabar te gotovo sve ptice; iznimke su lovne vrste poput šojke, svrake, sive vrane i fazana."
  reportHeading: "Prijava štete od lovne divljači"
  reportIntro: "Ako je lovna divljač oštetila vaše poljoprivredne ili šumske kulture u lovištu:"
  steps:
    - "U roku od tri dana od dana kad ste štetu primijetili, pisano je prijavite lovačkom društvu obrascem A. Preporučuje se preporučena pošta. Štetu možete prijaviti i na portalu eGozd."
    - "U prijavi navedite česticu i katastarsku općinu, datum nastanka i uočavanja štete, vrstu divljači i oštećene kulture, opseg štete te zaštitne mjere koje ste primijenili. Fotografije štete pomažu."
    - "U roku od osam dana od prijave društvo pregledava štetu i pokušava se s vama dogovoriti o njezinoj visini."
    - "Ako do dogovora ne dođe, štetu obrascem B pisano prijavite Komisiji za utvrđivanje visine štete na poljoprivrednim i šumskim kulturama pri mjesno nadležnoj upravnoj jedinici."
    - "Ako ni nakon procjene komisije ne postignemo dogovor, možete podnijeti tužbu nadležnom sudu, najkasnije tri godine od nastanka štete."
  formsText: "Obrasce A i B te popis tržnih otkupnih cijena naći ćete na stranici"
  egozd:
    text: "Štetu možete prijaviti i internetom, na portalu eGozd Zavoda za gozdove Slovenije (na slovenskom)."
    label: "Prijavite štetu u eGozd"
    url: "https://egozd.zgs.si/#/egozd/PrijavaSkode"
  protectedHeading: "Šteta od zaštićenih vrsta"
  protectedIntro: "Štetu koju počine zaštićene vrste lovačko društvo ne procjenjuje. Postupak vodi Zavod za gozdove Slovenije:"
  protectedSteps:
    - "U roku od tri dana od dana kad ste štetu primijetili, pisano je prijavite mjesno nadležnoj područnoj jedinici Zavoda za gozdove Slovenije. Preporučuje se i telefonski poziv."
    - "Zavod u roku od dva dana obavlja očevid i sastavlja zapisnik, a u roku od osam dana prema važećoj ljestvici određuje visinu naknade i predlaže vam sporazum."
    - "Ako se s visinom ne slažete, sporazum ne potpisujete. U roku od 30 dana od nastanka štete možete podnijeti zahtjev za isplatu naknade Agenciji RS za okoliš (ARSO); obrazac dobivate kod ovlaštenog procjenitelja Zavoda."
    - "Ako se ne slažete ni s odlukom agencije, možete podnijeti tužbu nadležnom sudu, najkasnije tri godine od nastanka štete."
  nonHunting:
    heading: "Šteta na nelovnim površinama"
    paragraphs:
      - "Nelovne površine su površine na kojima je lov zabranjen, naselja i zaseoci te vrtovi, nasadi i druge kulture ograđeni ogradom kroz koju ne mogu proći zec ni papkara. Za štetu od lovne divljači na njima odgovara Republika Slovenija."
      - "Štetu u roku od tri dana pisano prijavite mjesno nadležnoj područnoj jedinici Zavoda za gozdove Slovenije. Zavod u roku od osam dana obavlja očevid i predlaže sporazum; ako ga ne potpišete, štetu prijavite slovenskom Ministarstvu poljoprivrede, šumarstva i prehrane."
  compensationHeading: "Kako se izračunava naknada"
  compensationIntro: "Visina štete ovisi ponajprije o vrsti divljači te o kulturi i njezinoj razvojnoj fazi. Oštećeni ima pravo na naknadu:"
  compensation:
    - "za urod koji se u istoj sezoni ne može nadomjestiti: vrijednost uroda prema površini i kulturi, po tržnoj otkupnoj cijeni prethodne godine koju objavljuje slovenski Statistički ured, revaloriziranoj godišnjom inflacijom"
    - "za urod koji se u istoj sezoni može nadomjestiti: troškove rada i materijala za novu sjetvu ili sadnju te razliku u vrijednosti između uništenog i novog uroda"
    - "za usmrćenu domaću životinju: cijenu jednakovrijedne životinje i troškove nabave zamjenske"
    - "za ozlijeđenu domaću životinju: troškove liječenja i gubitak zbog propuštenih ili odgođenih uzgojnih ciljeva"
    - "za drugu štetu: iznos koji procijeni odgovarajući stručnjak"
  compensationNote: "Tržne otkupne cijene poljoprivrednih proizvoda skupljene su u popisu koji ćete naći među dokumentima."
  protectHeading: "Zaštita poljoprivrednih površina"
  protectIntro: "Učinkovita zaštita od divljači zahtijeva više mjera i redovito održavanje. Preporučujemo:"
  measures:
    - "električne ili obične ograde oko najugroženijih površina"
    - "sredstva za odvraćanje (vizualna, zvučna ili mirisna)"
    - "suradnju s lovačkim društvom na hranilištima koja odvraćaju divljač od polja"
    - "pravovremenu žetvu i uklanjanje ostataka uroda koji privlače divljač"
    - "zaštitne mreže ili folije na voćkama i u vinogradima"
  maintenance: "Redovito provjeravajte zaštitu, popravljajte oštećenja i obnavljajte sredstva za odvraćanje, kako bi mjere bile učinkovite cijelu sezonu."
  stewardship: "Pravo na naknadu ima vlasnik koji je kao dobar gospodar učinio sve razumno da svoju imovinu zaštiti od štete. Kod zaštićenih vrsta mora poštivati slovenski pravilnik o primjerenim načinima zaštite (Pravilnik o primernih načinih varovanja in vrstah ukrepov za preprečitev nadaljnje škode na premoženju)."
  sources:
    - label: "KGZS: šteta od divljači i zaštićenih vrsta (na slovenskom)"
      url: "https://www.kgzs.si/gozdarstvo-in-lovstvo/skoda-po-divjadi-in-zavarovanih-vrstah"
    - label: "Lovska zveza Slovenije: izračun naknade za štetu od divljači, 4. 5. 2026. (na slovenskom)"
      url: "https://www.lovska-zveza.si/2026/05/04/izracun-odskodnine-za-skodo-po-divjadi/"
    - label: "Zavod za gozdove Slovenije, eGozd: internetska prijava štete (na slovenskom)"
      url: "https://egozd.zgs.si/#/egozd/PrijavaSkode"

membership:
  lead: "Pozivamo nove članove koji žele sudjelovati u gospodarenju lovištem i zaštiti prirode."
  requirementsHeading: "Uvjeti za članstvo"
  requirementsIntro: "Kandidat za člana mora ispunjavati ove uvjete:"
  requirements:
    - "najmanje 18 godina starosti"
    - "državljanstvo Republike Slovenije"
    - "položen lovački ispit; tko ga još nema, počinje kao lovački pripravnik (vidi dolje)"
    - "neosuđivanost za kaznena djela iz područja lovstva"
    - "spremnost na aktivno sudjelovanje u društvu"
    - "poštovanje lovačke etike i tradicije"
  examHeading: "Put do lovačkog ispita"
  examIntro: "Lovački ispit ima praktični dio, koji polažete u lovačkom društvu, i teorijski dio pri područnom lovačkom savezu. Prema smjernicama Lovačkog saveza Slovenije (Lovska zveza Slovenije) put izgleda ovako:"
  examSteps:
    - heading: "Molba lovačkom društvu"
      text: "Lovačkom društvu šaljete pisanu molbu s osobnim podacima i kratko objašnjavate zašto vas zanimaju gospodarenje divljači i njezinim staništem te druženje s lovcima. Društvo o molbama u pravilu odlučuje na godišnjoj skupštini rano u proljeće."
    - heading: "Lovački pripravnik"
      text: "Kad društvo prihvati molbu, postajete lovački pripravnik. Dobivate mentora i akte društva te plaćate godišnju članarinu, koja pokriva pristojbe društva, područnog lovačkog saveza, OZUL-a i Lovačkog saveza Slovenije. Od tada primate i glasilo Lovec."
    - heading: "Praktična obuka"
      text: "Pripravnički staž traje od jedne do tri godine, a program praktične obuke obuhvaća 150 do 200 sati godišnje. Pod vodstvom mentora vodite dnevnik rada lovačkog pripravnika. Loviti smijete samo u pratnji lovca s važećom lovačkom iskaznicom, u pravilu mentora."
    - heading: "Praktični dio ispita"
      text: "Nakon pripravničkog staža mentor predaje potvrđeni dnevnik tročlanom ispitnom povjerenstvu koje imenuje društvo. Pred njim polažete praktični ispit i dobivate potvrdu o položenom praktičnom dijelu."
    - heading: "Teorijski dio ispita"
      text: "Tečaj organizira područni lovački savez; upisati se možete kad je položeni praktični dio upisan u informacijski sustav Lisjak. Predavači znanje provjeravaju na djelomičnim ispitima, a zatim polažete završni ispit pred tročlanim povjerenstvom iz biologije i ekologije divljači, lovačkog zakonodavstva i planiranja u lovstvu."
    - heading: "Svjedodžba i lovačka iskaznica"
      text: "Lovački savez Slovenije izdaje vam svjedodžbu o lovačkom ispitu. S njom možete dobiti lovačku iskaznicu."
  examNote: "Pripravnik prema slovenskom Zakonu o oružju može na upravnoj jedinici zatražiti dozvolu za nabavu lovačkog oružja. Uvjeti su ispit iz sigurnog rukovanja oružjem, liječnički pregled i članstvo u lovačkom društvu."
  applyHeading: "Postupak učlanjenja"
  applyText: "Ako vas zanima članstvo, pišite nam. Rado ćemo vam predstaviti društvo i odgovoriti na vaša pitanja."
  sources:
    - label: "Lovska zveza Slovenije: kako postati lovac (na slovenskom)"
      url: "https://www.lovska-zveza.si/informacijsko-sredisce/kako-postati-lovec/"

