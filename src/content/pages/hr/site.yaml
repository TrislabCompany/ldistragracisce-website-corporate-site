about:
  lead: "Lovačko društvo Istra Gračišče dio je lokalne zajednice od 1947. Lovačku tradiciju spajamo sa suvremenim gospodarenjem divljači i zaštitom prirode."
  sections:
    - heading: "Tko smo"
      paragraphs:
        - "Lovačko društvo (lovska družina) dobrovoljno je, samostalno i neprofitno udruženje ljudi koji su se povezali radi zaštite, uzgoja i lova divljači, gospodarenja lovištem i drugih djelatnosti povezanih s lovstvom."
        - "Aktivna smo zajednica koja spaja iskustvo starijih i energiju mlađih članova. Osim lova organiziramo edukacije i društvena događanja te sudjelujemo u ekološkim projektima lokalne zajednice."
    - heading: "Povijest"
      paragraphs:
        - "Društvo je osnovano 1947. kao mala skupina predanih lovaca. Kroz desetljeća je raslo, čuvajući ravnotežu između lovačke tradicije i suvremenog gospodarenja divljači."
    - heading: "Misija"
      paragraphs:
        - "Naša je misija održivo gospodarenje lovištem i divljači te poučavanje članova i javnosti o važnosti zaštite prirode. Zalažemo se za odgovoran lov utemeljen na poštovanju prirode i životinja te na očuvanju bioraznolikosti."
    - heading: "Vrijednosti"
      paragraphs:
        - "Temelj našeg rada su lovačka etika, odgovornost prema prirodi i divljači, suradnja s lokalnom zajednicom i prenošenje znanja mlađim naraštajima."
  officersHeading: "Organizacija"
  officersText: "Društvo vode izabrani dužnosnici. Navodimo ih po funkcijama; za kontakt koristite e-adresu društva."
  officers:
    - "Predsjednik društva (starešina)"
    - "Lovnik (gospodar)"
    - "Tajnik"
  clubHeading: "Više o društvu"

huntingGround:
  lead: "Lovište se prostire na raznolikom terenu slovenske Istre, gdje se isprepliću krški pašnjaci, šume i poljoprivredne površine."
  sections:
    - heading: "Područje lovišta"
      paragraphs:
        - "Lovište leži na Krškom rubu i obuhvaća teren od nizinskih predjela do viših krških visoravni. Posebnost lovišta je ispreplitanje staništa: krških pašnjaka, šumovitih padina i tradicionalnih poljoprivrednih površina."
        - "Taj raznoliki prostor pruža dobre uvjete za mnoge vrste divljači i omogućuje održivo gospodarenje lovištem."
  speciesHeading: "Divljač u lovištu"
  speciesIntro: "U lovištu živi divljač tipična za krško područje. Posebnu pozornost posvećujemo srnećoj divljači i divljim svinjama, dvjema najvažnijim vrstama lovišta."
  species:
    - id: red-deer
      name: "Jelen obični"
      latin: "Cervus elaphus"
      text: "Naša najveća vrsta divljači, koja se zadržava u šumovitim dijelovima lovišta."
      alt: "Jelen s razgranatim rogovljem na livadi"
    - id: roe-deer
      name: "Srneća divljač"
      latin: "Capreolus capreolus"
      text: "Jedna od dviju najvažnijih vrsta lovišta, kod kuće na rubu šume i na livadama."
      alt: "Privremena slika: crtež livade ispod brežuljaka"
    - id: wild-boar
      name: "Divlja svinja"
      latin: "Sus scrofa"
      text: "Druga najvažnija vrsta lovišta; njome gospodarimo u suradnji s lokalnim poljoprivrednicima."
      alt: "Privremena slika: crtež šume"
    - id: hare
      name: "Europski zec"
      latin: "Lepus europaeus"
      text: "Sitna divljač otvorenih livada i polja."
      alt: "Privremena slika: crtež travnatih brežuljaka ujutro"
    - id: fox
      name: "Lisica"
      latin: "Vulpes vulpes"
      text: "Prilagodljiva zvijer koja živi u svim dijelovima lovišta."
      alt: "Privremena slika: crtež jesenskog krajolika"
    - id: badger
      name: "Jazavac"
      latin: "Meles meles"
      text: "Noćna životinja šumovitih padina."
      alt: "Privremena slika: crtež brežuljaka navečer"
    - id: partridge
      name: "Trčka skvržulja"
      latin: "Perdix perdix"
      text: "Pernata divljač krških pašnjaka i polja."
      alt: "Privremena slika: crtež krškog pašnjaka"
    - id: pheasant
      name: "Fazan"
      latin: "Phasianus colchicus"
      text: "Pernata divljač polja i živica."
      alt: "Privremena slika: crtež krajolika u magli"
  management:
    heading: "Gospodarenje lovištem"
    paragraphs:
      - "Gospodarenje se temelji na načelima održivog lovstva i zaštite prirode. Redovito pratimo stanje populacija divljači, brinemo o hranilištima i solištima te održavamo lovačke čeke i druge objekte."
      - "Posebnu pozornost posvećujemo sprječavanju šteta na poljoprivrednim površinama i suradnji s lokalnim poljoprivrednicima."

