about:
  lead: "Lovska družina Istra Gračišče je že od leta 1947 del lokalne skupnosti. Lovsko tradicijo združujemo s sodobnim upravljanjem z divjadjo in varstvom narave."
  sections:
    - heading: "Kdo smo"
      paragraphs:
        - "Lovska družina je prostovoljno, samostojno in nepridobitno združenje ljudi, ki so se povezali zaradi varstva, gojitve in lova divjadi, upravljanja lovišča ter drugih z lovstvom povezanih dejavnosti."
        - "Smo dejavna skupnost, ki združuje izkušnje starejših in energijo mlajših članov. Poleg lova organiziramo izobraževanja in družabne dogodke ter sodelujemo pri okoljskih projektih v lokalni skupnosti."
    - heading: "Zgodovina"
      paragraphs:
        - "Družina je bila ustanovljena leta 1947 kot majhna skupina predanih lovcev. Skozi desetletja je rasla in pri tem ohranjala ravnovesje med lovsko tradicijo in sodobnimi načini upravljanja z divjadjo."
    - heading: "Poslanstvo"
      paragraphs:
        - "Naše poslanstvo je trajnostno upravljanje z loviščem in divjadjo ter izobraževanje članov in širše javnosti o pomenu varstva narave. Zavzemamo se za odgovoren lov, ki temelji na spoštovanju narave in živali ter na ohranjanju biotske raznovrstnosti."
    - heading: "Vrednote"
      paragraphs:
        - "Temelj našega dela so lovska etika, odgovornost do narave in divjadi, sodelovanje z lokalno skupnostjo in prenašanje znanja na mlajše rodove."
  officersHeading: "Organizacija"
  officersText: "Družino vodijo izvoljeni funkcionarji. Navajamo jih po funkcijah; za stik uporabite e-naslov družine."
  officers:
    - "Starešina"
    - "Gospodar"
    - "Tajnik"
  clubHeading: "Več o družini"

huntingGround:
  lead: "Lovišče se razprostira na razgibanem terenu slovenske Istre, kjer se prepletajo kraške gmajne, gozdovi in kmetijske površine."
  sections:
    - heading: "Območje lovišča"
      paragraphs:
        - "Lovišče leži na območju Kraškega roba in zajema teren od nižinskih predelov do višjih kraških planot. Posebnost lovišča je preplet habitatov: kraške gmajne, gozdnata pobočja in tradicionalne kmetijske površine."
        - "To raznoliko okolje nudi dobre pogoje za različne vrste divjadi in omogoča trajnostno upravljanje z loviščem."
  speciesHeading: "Divjad v lovišču"
  speciesIntro: "V lovišču živi divjad, značilna za kraško območje. Posebno pozornost namenjamo srnjadi in divjim prašičem, najpomembnejšima vrstama v lovišču."
  species:
    - id: red-deer
      name: "Jelenjad"
      latin: "Cervus elaphus"
      text: "Naša največja vrsta divjadi, ki se zadržuje v gozdnatih predelih lovišča."
      alt: "Jelen na travniku z razvejanim rogovjem"
    - id: roe-deer
      name: "Srnjad"
      latin: "Capreolus capreolus"
      text: "Ena od dveh najpomembnejših vrst v lovišču, doma na robu gozda in na travnikih."
      alt: "Srnjak na travniku v jutranji meglici"
    - id: wild-boar
      name: "Divji prašič"
      latin: "Sus scrofa"
      text: "Druga od najpomembnejših vrst v lovišču; pri upravljanju z njo sodelujemo z lokalnimi kmeti."
      alt: "Divja svinja s progastimi mladiči v gozdu"
    - id: hare
      name: "Poljski zajec"
      latin: "Lepus europaeus"
      text: "Mala divjad odprtih travnikov in polj."
      alt: "Poljski zajec v travi na robu gozda"
    - id: fox
      name: "Lisica"
      latin: "Vulpes vulpes"
      text: "Prilagodljiva zver, ki živi v vseh delih lovišča."
      alt: "Lisica gleda iz visoke trave"
    - id: jackal
      name: "Šakal"
      latin: "Canis aureus"
      text: "Se v zadnjih letih širi po Krasu in Istri."
      alt: "Šakal stoji na pokošenem travniku in gleda proti fotografu"
    - id: partridge
      name: "Poljska jerebica"
      latin: "Perdix perdix"
      text: "Pernata divjad kraških gmajn in polj."
      alt: "Poljske jerebice na zorani njivi ob grmovju"
    - id: pheasant
      name: "Fazan"
      latin: "Phasianus colchicus"
      text: "Pernata divjad polj in mejic."
      alt: "Fazan petelin na travniku"
  management:
    heading: "Upravljanje z loviščem"
    paragraphs:
      - "Upravljanje temelji na načelih trajnostnega lovstva in varstva narave. Redno spremljamo stanje populacij divjadi, skrbimo za krmišča in solnice ter vzdržujemo lovske preže in druge objekte."
      - "Posebno pozornost namenjamo preprečevanju škode na kmetijskih površinah in sodelovanju z lokalnimi kmeti."

huntingTourism:
  sections:
    - heading: "Lov v slovenski Istri"
      paragraphs:
        - "Gostom ponujamo lov na jelenjad, srnjad in divjega prašiča v raznolikem lovišču med Kraškim robom in istrskimi griči."
        - "Vsak gost lovi v spremstvu izkušenega lovca družine, ki pozna lovišče in divjad. Gost upošteva navodila spremljevalca in strelja le divjad, ki mu jo spremljevalec določi."
    - heading: "Prenočišče v lovskem domu"
      paragraphs:
        - "Lovski gostje lahko prenočijo v lovskem domu družine. Prespijo tam, kjer se lov začne, in so zjutraj in zvečer, ko je divjad najbolj dejavna, hitro na lovu."
        - "Prenočišče v lovskem domu je ena od prednosti našega lovskega turizma. Pogoje bivanja pove referent za lovski turizem."
  offersHeading: "Naša ponudba"
  seasonsHeading: "Lovne dobe"
  seasonsIntro: "Lovne dobe določa Uredba o določitvi divjadi in lovnih dob. Odvisne so od vrste, spola in starosti divjadi:"
  seasonColumns:
    species: "Vrsta"
    season: "Lovna doba"
  seasons:
    - species: "Jelen"
      season: "16. 8.–31. 12."
    - species: "Košuta"
      season: "1. 9.–31. 12."
    - species: "Srnjak"
      season: "1. 5.–31. 10."
    - species: "Divji prašič: merjasec, ozimci in lanščaki"
      season: "vse leto"
    - species: "Divji prašič: svinja"
      season: "1. 7.–31. 1."
  needsHeading: "Kaj potrebuje lovec gost"
  needs:
    - "dovolilnico za lovske goste, če nima veljavne slovenske lovske izkaznice (glejte spodaj)"
    - "evropsko orožno prepustnico, če prinese svoje orožje iz druge države Evropske unije"
    - "termin lova, dogovorjen z referentom za lovski turizem"
    - "spremstvo lovca naše družine, ki ga družina določi za vsak lov"
  permit:
    heading: "Dovolilnica za lovske goste"
    paragraphs:
      - "Lovski gost, ki nima veljavne slovenske lovske izkaznice, si pravico do lova pridobi z dovolilnico za lovske goste. Obliko, vsebino in ceno dovolilnice določa Pravilnik o dovolilnici za lovske goste (Uradni list RS, št. 86/2025), ki se uporablja od 1. januarja 2026."
      - "Tedenska dovolilnica velja 7 dni in stane 20 evrov, mesečna velja 30 dni in stane 50 evrov, letna pa velja do konca koledarskega leta in stane 150 evrov. Gostu, ki ga na lov povabi upravljavec lovišča, se lahko izda brezplačna dovolilnica, ki velja 5 dni."
      - "Dovolilnica navaja lovišče ter ime, naslov, datum rojstva in državo stalnega prebivališča gosta. Kako jo uredite za lov v našem lovišču, vam pove referent za lovski turizem."
  enquireHeading: "Povpraševanje"
  enquireText: "Pišite nam ali pokličite referenta za lovski turizem in povejte, katera divjad in kateri termin vas zanimata. Odgovorili vam bomo s pogoji in ponudbo."
  sources:
    - label: "Lovne dobe po Uredbi o določitvi divjadi in lovnih dob, povzete na gov.si (Upravljanje z divjadjo)"
      url: "https://www.gov.si/teme/upravljanje-z-divjadjo/"
    - label: "Pravilnik o dovolilnici za lovske goste (Uradni list RS, št. 86/2025)"
      url: "https://pisrs.si/pregledPredpisa?sop=2025-01-3056"

huntingLodge:
  lead: "Lovski dom je zbirališče članov družine in prenočišče za naše lovske goste."
  sections:
    - heading: "Lovski dom"
      paragraphs:
        - "V lovskem domu se člani srečujejo na sestankih, pred skupnimi lovi in ob družabnih dogodkih."
        - "Dom nudi tudi prenočišče lovskim gostom. Gostje bivajo tam, kjer se lov začne, v družbi lovcev, ki jih spremljajo na lovu."
  featuresHeading: "Kaj nudi"
  features:
    - "prenočišče za lovske goste"
    - "prostor za srečanja in sestanke članov"
    - "izhodišče za skupne love"
    - "druženje lovcev gostov z lovci družine"
  tourismHeading: "Prenočišče za lovske goste"
  tourismText: "Prenočišče v lovskem domu je ena od prednosti našega lovskega turizma: gost prespi na izhodišču za lov in je zjutraj hitro na preži. Pogoje bivanja in ponudbo lova vam pove referent za lovski turizem."

gameDamage:
  lead: "Kdo odgovarja za škodo po divjadi, kako jo prijavite, kako se izračuna odškodnina in kako zaščitite svoje površine."
  kindsHeading: "Lovna divjad ali zavarovana vrsta?"
  kindsIntro: "Lovska družina ocenjuje samo škodo, ki jo naredi lovna divjad v lovišču. Škodo po zavarovanih vrstah prijavite Zavodu za gozdove Slovenije."
  kinds:
    - heading: "Lovna divjad: prijava lovski družini"
      text: "Za škodo po lovni divjadi v lovišču po Zakonu o divjadi in lovstvu odgovarja upravljavec lovišča, pri nas Lovska družina Istra Gračišče."
      species: "Lovna divjad so na primer divji prašič, jelenjad, srnjad, jazbec, poljski zajec, lisica, kune, fazan, šoja, sraka in siva vrana."
    - heading: "Zavarovane vrste: prijava Zavodu za gozdove"
      text: "Za škodo po zavarovanih prostoživečih sesalcih in pticah po Zakonu o ohranjanju narave odgovarja Republika Slovenija. Prijavite jo krajevno pristojni območni enoti Zavoda za gozdove Slovenije, ne lovski družini."
      species: "Zavarovane vrste so na primer volk, rjavi medved, ris, vidra in bober ter skoraj vse ptice; izjeme so lovne vrste, kot so šoja, sraka, siva vrana in fazan."
  reportHeading: "Prijava škode po lovni divjadi"
  reportIntro: "Če je lovna divjad naredila škodo na vaših kmetijskih ali gozdnih kulturah v lovišču, ravnajte takole:"
  steps:
    - "V treh dneh od dneva, ko ste škodo opazili, jo pisno prijavite lovski družini z obrazcem A. Priporočljiva je priporočena pošta. Škodo lahko prijavite tudi na portalu eGozd."
    - "Na prijavi navedite parcelo in katastrsko občino, datum nastanka in opažanja škode, vrsto divjadi in poškodovane kulture, obseg škode ter zaščitne ukrepe, ki ste jih uporabili. Fotografije škode so v pomoč."
    - "V osmih dneh od prijave si družina škodo ogleda in se z vami poskuša sporazumeti o njeni višini."
    - "Če do sporazuma ne pride, škodo z obrazcem B pisno prijavite Komisiji za določanje višine škode na kmetijskih in gozdnih kulturah pri krajevno pristojni upravni enoti."
    - "Če se tudi po oceni komisije ne sporazumemo, lahko vložite tožbo pri pristojnem sodišču, najpozneje v treh letih od nastanka škode."
  formsText: "Obrazca A in B ter zbirnik tržnih odkupnih cen najdete na strani"
  egozd:
    text: "Škodo lahko prijavite tudi prek spleta, na portalu eGozd Zavoda za gozdove Slovenije."
    label: "Prijavite škodo v eGozd"
    url: "https://egozd.zgs.si/#/egozd/PrijavaSkode"
  protectedHeading: "Škoda po zavarovanih vrstah"
  protectedIntro: "Škode, ki jo naredijo zavarovane vrste, lovska družina ne ocenjuje. Postopek vodi Zavod za gozdove Slovenije:"
  protectedSteps:
    - "V treh dneh od dneva, ko ste škodo opazili, jo pisno prijavite krajevno pristojni območni enoti Zavoda za gozdove Slovenije. Priporočljiv je tudi telefonski klic."
    - "Zavod v dveh dneh opravi ogled in napiše zapisnik, v osmih dneh pa po veljavni lestvici določi višino odškodnine in vam predlaga sporazum."
    - "Če se z višino ne strinjate, sporazuma ne podpišete. V 30 dneh od nastanka škode lahko vložite vlogo za izplačilo odškodnine na Agencijo RS za okolje; obrazec dobite pri pooblaščenem cenilcu Zavoda."
    - "Če se ne strinjate niti z odločitvijo agencije, lahko vložite tožbo pri pristojnem sodišču, najpozneje v treh letih od nastanka škode."
  nonHunting:
    heading: "Škoda na nelovnih površinah"
    paragraphs:
      - "Nelovne površine so površine, kjer je lov prepovedan, naselja in zaselki ter vrtovi, nasadi in druge kulture, ograjene z ograjo, skozi katero ne moreta zajec ali parkljasta divjad. Za škodo lovne divjadi na njih odgovarja Republika Slovenija."
      - "Škodo v treh dneh pisno prijavite krajevno pristojni območni enoti Zavoda za gozdove Slovenije. Zavod v osmih dneh opravi ogled in predlaga sporazum; če ga ne podpišete, škodo prijavite Ministrstvu za kmetijstvo, gozdarstvo in prehrano."
  compensationHeading: "Kako se izračuna odškodnina"
  compensationIntro: "Višina škode je odvisna predvsem od vrste divjadi ter od kulture in njene razvojne faze. Oškodovanec je upravičen do odškodnine:"
  compensation:
    - "za pridelek, ki ga v isti sezoni ni mogoče nadomestiti: vrednost pridelka glede na površino in kulturo, po tržni odkupni ceni preteklega leta, ki jo objavi Statistični urad RS, revalorizirani z letno inflacijo"
    - "za pridelek, ki ga je v isti sezoni mogoče nadomestiti: stroške dela in materiala za nov posevek ter razliko v vrednosti med uničenim in novim pridelkom"
    - "za usmrčeno domačo žival: ceno enakovredne živali in stroške nakupa nadomestne"
    - "za poškodovano domačo žival: stroške zdravljenja in izgubo zaradi zamujenih ali zakasnjenih rejskih ciljev"
    - "za drugo škodo: znesek, ki ga oceni ustrezen strokovnjak"
  compensationNote: "Tržne odkupne cene kmetijskih pridelkov so zbrane v zbirniku, ki ga najdete med dokumenti."
  protectHeading: "Zaščita kmetijskih površin"
  protectIntro: "Učinkovita zaščita pred divjadjo zahteva več ukrepov in redno vzdrževanje. Priporočamo:"
  measures:
    - "električne ali navadne ograje okoli najbolj ogroženih površin"
    - "odvračala (vidna, zvočna ali vonjalna)"
    - "sodelovanje z lovsko družino pri krmiščih, ki divjad odvračajo od polj"
    - "pravočasno žetev in odstranjevanje ostankov pridelka, ki privabljajo divjad"
    - "zaščitne mreže ali folije na sadnem drevju in v vinogradih"
  maintenance: "Zaščito redno preverjajte, popravljajte poškodbe in obnavljajte odvračala, da bodo ukrepi učinkoviti vso sezono."
  stewardship: "Do odškodnine je upravičen lastnik, ki je kot dober gospodar naredil vse, kar je glede na možnost nastanka škode razumno, da bi svoje premoženje pred škodo obvaroval. Pri zavarovanih vrstah mora upoštevati Pravilnik o primernih načinih varovanja in vrstah ukrepov za preprečitev nadaljnje škode na premoženju."
  sources:
    - label: "KGZS: Škoda po divjadi in zavarovanih vrstah"
      url: "https://www.kgzs.si/gozdarstvo-in-lovstvo/skoda-po-divjadi-in-zavarovanih-vrstah"
    - label: "Lovska zveza Slovenije: Izračun odškodnine za škodo po divjadi (4. 5. 2026)"
      url: "https://www.lovska-zveza.si/2026/05/04/izracun-odskodnine-za-skodo-po-divjadi/"
    - label: "Zavod za gozdove Slovenije, eGozd: spletna prijava škode"
      url: "https://egozd.zgs.si/#/egozd/PrijavaSkode"

membership:
  lead: "Vabimo nove člane, ki želijo sodelovati pri upravljanju z loviščem in varstvu narave."
  requirementsHeading: "Pogoji za članstvo"
  requirementsIntro: "Kandidat za člana mora izpolnjevati te pogoje:"
  requirements:
    - "starost najmanj 18 let"
    - "državljanstvo Republike Slovenije"
    - "opravljen lovski izpit; kdor ga še nima, začne kot lovski pripravnik (glejte spodaj)"
    - "nekaznovanost za kazniva dejanja s področja lovstva"
    - "pripravljenost na dejavno sodelovanje v družini"
    - "spoštovanje lovske etike in tradicije"
  examHeading: "Pot do lovskega izpita"
  examIntro: "Lovski izpit ima praktični del, ki ga opravite v lovski družini, in teoretični del pri območni lovski zvezi. Po smernicah Lovske zveze Slovenije pot poteka takole:"
  examSteps:
    - heading: "Prošnja lovski družini"
      text: "Lovski družini pošljete pisno prošnjo z osebnimi podatki in na kratko pojasnite, zakaj vas zanimajo upravljanje z divjadjo in njenim okoljem ter druženje z lovci. Prošnje družina praviloma obravnava na letni skupščini zgodaj spomladi."
    - heading: "Lovski pripravnik"
      text: "Ko družina prošnjo sprejme, postanete lovski pripravnik. Dobite mentorja in akte družine ter plačate letno članarino, ki pokriva pristojbine družine, območne lovske zveze, OZUL in Lovske zveze Slovenije. Od tedaj prejemate tudi glasilo Lovec."
    - heading: "Praktično usposabljanje"
      text: "Pripravniška doba traja od enega do treh let, program praktičnega usposabljanja pa obsega 150 do 200 ur na leto. Pod vodstvom mentorja vodite dnevnik dela lovskega pripravnika. Lovite lahko le v spremstvu lovca z veljavno lovsko izkaznico, praviloma mentorja."
    - heading: "Praktični del izpita"
      text: "Po pripravniški dobi mentor odda potrjeni dnevnik tričlanski izpitni komisiji, ki jo imenuje družina. Pred njo opravite praktični izpit in dobite potrdilo o opravljenem praktičnem delu."
    - heading: "Teoretični del izpita"
      text: "Tečaj organizira območna lovska zveza; vpišete se lahko, ko je opravljeni praktični del vpisan v informacijski sistem Lisjak. Predavatelji znanje preverijo na delnih izpitih, nato opravite zaključni izpit pred tričlansko komisijo iz biologije in ekologije divjadi, lovske zakonodaje in načrtovanja v lovstvu."
    - heading: "Spričevalo in lovska izkaznica"
      text: "Lovska zveza Slovenije vam izda spričevalo o lovskem izpitu. Z njim lahko pridobite lovsko izkaznico."
  examNote: "Pripravnik lahko po Zakonu o orožju na upravni enoti zaprosi za nabavno dovoljenje za lovsko orožje. Pogoji so izpit iz varnega ravnanja z orožjem, zdravniški pregled in članstvo v lovski družini."
  applyHeading: "Postopek včlanitve"
  applyText: "Če vas zanima članstvo, nam pišite. Z veseljem vam predstavimo družino in odgovorimo na vaša vprašanja."
  sources:
    - label: "Lovska zveza Slovenije: Kako postati lovec"
      url: "https://www.lovska-zveza.si/informacijsko-sredisce/kako-postati-lovec/"

