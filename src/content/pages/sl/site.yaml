huntingLodge:
  lead: "Lovski dom je zbirališče članov družine in izhodišče za skupne love."
  sections:
    - heading: "Lovski dom"
      paragraphs:
        - "V lovskem domu se člani srečujejo na sestankih, pred skupnimi lovi in ob družabnih dogodkih. V njem sprejmemo tudi lovce goste."
  featuresHeading: "Kaj nudi"
  features:
    - "prostor za srečanja in sestanke članov"
    - "izhodišče za skupne love"
    - "sprejem lovcev gostov"
  pending: "Fotografije lovskega doma, njegovo lego in opis, kaj nudi, pripravi družina."

gameDamage:
  lead: "Kako prijavite škodo, ki jo je divjad povzročila na kmetijskih površinah, in kako površine zaščitite."
  reportHeading: "Kako prijaviti škodo"
  reportIntro: "Če ste na svojih površinah opazili škodo, ki jo je povzročila divjad, sledite tem korakom:"
  steps:
    - "Takoj po tem, ko škodo opazite, obvestite lovsko družino. Kontakt najdete na strani Kontakt."
    - "Pripravite podatke o lokaciji, obsegu in vrsti škode ter fotografije ali druge dokaze."
    - "Z lovsko družino sodelujte pri ogledu in dokumentiranju škode ter izpolnite potrebne obrazce."
  protectHeading: "Zaščita kmetijskih površin"
  protectIntro: "Učinkovita zaščita pred divjadjo zahteva več ukrepov in redno vzdrževanje. Priporočamo:"
  measures:
    - "električne ali navadne ograje okoli najbolj ogroženih površin"
    - "odvračala (vidna, zvočna ali vonjalna)"
    - "sodelovanje z lovsko družino pri krmiščih, ki divjad odvračajo od polj"
    - "pravočasno žetev in odstranjevanje ostankov pridelka, ki privabljajo divjad"
    - "zaščitne mreže ali folije na sadnem drevju in v vinogradih"
  maintenance: "Zaščito redno preverjajte, popravljajte poškodbe in obnavljajte odvračala, da bodo ukrepi učinkoviti vso sezono."

membership:
  lead: "Vabimo nove člane, ki želijo sodelovati pri upravljanju z loviščem in varstvu narave."
  requirementsHeading: "Pogoji za članstvo"
