about:
  lead: "Lovačko društvo Istra Gračišče deo je lokalne zajednice od 1947. Lovačku tradiciju spajamo sa savremenim gazdovanjem divljači i zaštitom prirode."
  sections:
    - heading: "Ko smo"
      paragraphs:
        - "Lovačko društvo (lovska družina) je dobrovoljno, samostalno i neprofitno udruženje ljudi koji su se povezali radi zaštite, gajenja i lova divljači, gazdovanja lovištem i drugih delatnosti povezanih sa lovstvom."
        - "Aktivna smo zajednica koja spaja iskustvo starijih i energiju mlađih članova. Pored lova organizujemo obuke i društvene događaje i učestvujemo u ekološkim projektima lokalne zajednice."
    - heading: "Istorija"
      paragraphs:
        - "Društvo je osnovano 1947. kao mala grupa posvećenih lovaca. Kroz decenije je raslo, čuvajući ravnotežu između lovačke tradicije i savremenog gazdovanja divljači."
    - heading: "Misija"
      paragraphs:
        - "Naša misija je održivo gazdovanje lovištem i divljači i poučavanje članova i javnosti o važnosti zaštite prirode. Zalažemo se za odgovoran lov zasnovan na poštovanju prirode i životinja i na očuvanju biodiverziteta."
    - heading: "Vrednosti"
      paragraphs:
        - "Temelj našeg rada su lovačka etika, odgovornost prema prirodi i divljači, saradnja sa lokalnom zajednicom i prenošenje znanja mlađim generacijama."
  officersHeading: "Organizacija"
  officersText: "Društvo vode izabrani funkcioneri. Navodimo ih po funkcijama; za kontakt koristite imejl adresu društva."
  officers:
    - "Predsednik društva (starešina)"
    - "Lovočuvar-upravnik (gospodar)"
    - "Sekretar (tajnik)"
  clubHeading: "Više o društvu"

huntingGround:
  lead: "Lovište se prostire na raznovrsnom terenu slovenačke Istre, gde se prepliću kraški pašnjaci, šume i poljoprivredne površine."
  sections:
    - heading: "Područje lovišta"
      paragraphs:
        - "Lovište leži na Kraškom rubu i obuhvata teren od nizijskih delova do viših kraških visoravni. Posebnost lovišta je preplitanje staništa: kraških pašnjaka, šumovitih padina i tradicionalnih poljoprivrednih površina."
        - "Ovaj raznovrsni prostor pruža dobre uslove za mnoge vrste divljači i omogućava održivo gazdovanje lovištem."
  speciesHeading: "Divljač u lovištu"
  speciesIntro: "U lovištu živi divljač tipična za kraško područje. Posebnu pažnju posvećujemo srnama i divljim svinjama, dvema najvažnijim vrstama lovišta."
  species:
    - id: red-deer
      name: "Jelen"
      latin: "Cervus elaphus"
      text: "Naša najveća vrsta divljači, koja se zadržava u šumovitim delovima lovišta."
      alt: "Jelen sa razgranatim rogovima na livadi"
    - id: roe-deer
      name: "Srna"
      latin: "Capreolus capreolus"
      text: "Jedna od dve najvažnije vrste lovišta, kod kuće na ivici šume i na livadama."
      alt: "Privremena slika: crtež livade ispod brežuljaka"
    - id: wild-boar
      name: "Divlja svinja"
      latin: "Sus scrofa"
      text: "Druga najvažnija vrsta lovišta; njome gazdujemo u saradnji sa lokalnim poljoprivrednicima."
      alt: "Privremena slika: crtež šume"
    - id: hare
      name: "Zec"
      latin: "Lepus europaeus"
      text: "Sitna divljač otvorenih livada i polja."
      alt: "Privremena slika: crtež travnatih brežuljaka ujutru"
    - id: fox
      name: "Lisica"
      latin: "Vulpes vulpes"
      text: "Prilagodljiva zver koja živi u svim delovima lovišta."
      alt: "Privremena slika: crtež jesenjeg pejzaža"
    - id: badger
      name: "Jazavac"
      latin: "Meles meles"
      text: "Noćna životinja šumovitih padina."
      alt: "Privremena slika: crtež brežuljaka uveče"
    - id: partridge
      name: "Jarebica"
      latin: "Perdix perdix"
      text: "Pernata divljač kraških pašnjaka i polja."
      alt: "Privremena slika: crtež kraškog pašnjaka"
    - id: pheasant
      name: "Fazan"
      latin: "Phasianus colchicus"
      text: "Pernata divljač polja i živica."
      alt: "Privremena slika: crtež pejzaža u magli"
  management:
    heading: "Gazdovanje lovištem"
    paragraphs:
      - "Gazdovanje se zasniva na načelima održivog lovstva i zaštite prirode. Redovno pratimo stanje populacija divljači, brinemo o hranilištima i solištima i održavamo lovačke čeke i druge objekte."
      - "Posebnu pažnju posvećujemo sprečavanju šteta na poljoprivrednim površinama i saradnji sa lokalnim poljoprivrednicima."

