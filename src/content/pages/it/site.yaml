  enquireHeading: "Richieste"
  enquireText: "Scriveteci quale selvaggina e quali date vi interessano. Vi risponderemo con le condizioni e un'offerta."

huntingLodge:
  lead: "La casa di caccia è il luogo d'incontro dei soci e il punto di partenza delle cacce collettive."
  sections:
    - heading: "La casa di caccia"
      paragraphs:
        - "Nella casa di caccia i soci si incontrano per le riunioni, prima delle cacce collettive e in occasione degli eventi. Vi accogliamo anche i cacciatori ospiti."
  featuresHeading: "Cosa offre"
  features:
    - "uno spazio per le riunioni dei soci"
    - "il punto di partenza delle cacce collettive"
    - "l'accoglienza dei cacciatori ospiti"
  pending: "Le foto della casa di caccia, la sua posizione e cosa offre vengono fornite dalla società."

gameDamage:
  lead: "Come segnalare i danni causati dalla selvaggina ai terreni agricoli e come proteggerli."
  reportHeading: "Come segnalare un danno"
  reportIntro: "Se trovate sui vostri terreni un danno causato dalla selvaggina, seguite questi passi:"
  steps:
    - "Appena notate il danno, avvisate la società venatoria. I contatti sono nella pagina Contatti."
    - "Annotate dove si trova il danno, quanto è esteso e di che tipo è, e scattate foto o conservate altre prove."
    - "Collaborate con la società venatoria al sopralluogo e alla documentazione del danno e compilate i moduli necessari."
  protectHeading: "Proteggere i terreni agricoli"
  protectIntro: "Proteggere i terreni dalla selvaggina richiede più misure e una manutenzione regolare. Consigliamo:"
  measures:
    - "recinzioni elettriche o normali intorno ai terreni più a rischio"
    - "dissuasori (visivi, sonori od olfattivi)"
    - "la collaborazione con la società venatoria per mangiatoie che allontanino la selvaggina dai campi"
    - "il raccolto puntuale e la rimozione dei residui che attirano la selvaggina"
    - "reti o teli di protezione sugli alberi da frutto e nei vigneti"
  maintenance: "Controllate regolarmente le protezioni, riparate i danni e rinnovate i dissuasori, perché le misure funzionino per tutta la stagione."

membership:
  lead: "Accogliamo nuovi soci che vogliono partecipare alla gestione della riserva e alla tutela della natura."
  requirementsHeading: "Requisiti per l'adesione"
  requirementsIntro: "Il candidato socio deve soddisfare questi requisiti:"
  requirements:
    - "almeno 18 anni di età"
    - "cittadinanza della Repubblica di Slovenia"
    - "esame di caccia superato"
    - "nessuna condanna per reati in materia di caccia"
    - "disponibilità a partecipare attivamente alla vita della società"
    - "rispetto dell'etica e della tradizione venatoria"
  examHeading: "Il percorso verso l'esame di caccia"
  examIntro: "Il percorso verso l'esame di caccia comprende una formazione teorica e pratica:"
  examSteps:
    - "Formazione teorica (40 ore)."
    - "Formazione pratica nella riserva con un tutor."
    - "Conoscenza delle armi da caccia e del loro uso sicuro."
    - "L'esame di caccia davanti alla commissione."
  applyHeading: "Come aderire"
  applyText: "Se vi interessa l'adesione, scriveteci. Saremo lieti di presentarvi la società e rispondere alle vostre domande."

